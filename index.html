    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}
    a{color:var(--blue)}
    /* Foco de doble anillo: el aro oscuro asegura contraste sobre fondos claros y el ambar sobre fondos oscuros. */
    :focus-visible{outline:3px solid #10233d;outline-offset:2px;box-shadow:0 0 0 6px #ffca28cc;border-radius:6px}
    .hidden{display:none!important}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.app{min-height:100vh}.setup{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 8% 8%,#194a83 0,transparent 28%),radial-gradient(circle at 95% 15%,#315f39 0,transparent 27%),var(--navy)}
    .setup-card{width:min(1120px,100%);background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 32px 80px #0008;display:grid;grid-template-columns:.9fr 1.1fr}
    .setup-hero{padding:46px;background:linear-gradient(150deg,#0c2541,#07111f);color:white;position:relative;overflow:hidden}
    .setup-hero:after{content:"";position:absolute;width:260px;height:260px;border:60px solid #42a45c33;border-radius:50%;right:-110px;bottom:-110px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#9fc3f5}.setup h1{font-size:clamp(38px,6vw,68px);line-height:.98;margin:18px 0}.setup-hero p{font-size:18px;color:#d3e1f3;max-width:460px}
    .feature-list{display:grid;gap:12px;margin-top:34px}.feature{display:flex;gap:11px;align-items:center;color:#e9f1fa}.feature i{font-style:normal;width:34px;height:34px;display:grid;place-items:center;background:#ffffff16;border:1px solid #ffffff26;border-radius:10px}
    .author{position:relative;z-index:1;margin-top:38px;font-size:13px;color:#adbed1}.author a{color:white;font-weight:700}
    .setup-form{padding:40px}.setup-form h2{font-size:26px;margin:0 0 6px}.setup-form>p{color:var(--muted);margin-top:0}.field-label{display:block;font-size:13px;font-weight:800;margin:18px 0 8px}.players-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input-wrap{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:7px 10px;background:white}.input-wrap span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800}.input-wrap input{border:0;outline:0;min-width:0;width:100%;padding:7px;background:transparent}.select,.text-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;color:var(--ink)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.privacy-choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #b8d5c0;background:#f0fbf3;border-radius:12px;padding:11px;margin-top:14px}.privacy-choice input{width:18px;height:18px;margin-top:1px}.privacy-choice b{display:block;font-size:12px}.privacy-choice small{display:block;color:#486456;font-size:11px;margin-top:2px}.setup-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.16s transform,.16s background}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn-primary{background:var(--blue);color:white;box-shadow:0 8px 20px #1769e044}.btn-secondary{background:#eef3f8;color:var(--ink)}.btn-danger{background:var(--red2);color:var(--red)}.btn-small{padding:7px 10px;font-size:12px}.btn-wide{width:100%;padding:14px}
    .topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:white;display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;gap:18px;padding:10px 18px;box-shadow:0 5px 18px #0003}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#4f98ff,#2fb45a);display:grid;place-items:center;font-weight:900}.brand strong{display:block}.brand small{display:block;color:#9eb1c6;font-size:12px}.status-pills{display:flex;gap:7px;align-items:center;flex:1}.pill{padding:6px 10px;border-radius:999px;background:#ffffff13;border:1px solid #ffffff20;font-size:12px;font-weight:800}.top-actions{display:flex;gap:7px}.icon-btn{border:1px solid #ffffff22;background:#ffffff12;color:white;border-radius:10px;padding:8px 10px;font-weight:700}
    .players-strip{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 18px;overflow-x:auto}.turn-label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:3px}.player-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 5px;white-space:nowrap;background:white}.player-chip.active{border:2px solid var(--amber);background:var(--amber2);box-shadow:0 0 0 3px #ffc92825}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900}.player-chip b{font-size:13px}.player-chip small{color:var(--muted)}
    .game-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;padding:14px;max-width:1800px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 18px #15304e0b}.board-panel{padding:14px;min-width:0}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.panel-head h2{font-size:18px;margin:0}.panel-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.inventory{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.inventory b{font-size:11px;color:var(--muted)}.solution-chip{border:1px solid #b7d9fa;background:#eef7ff;color:#165891;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}

    function storyCard(s){const selectable=state.phase==='play'&&(s.status==='progress'||s.status==='blocked'||(s.status==='todo'&&!wipBlocksNew()))&&!state.turnActionDone,wholeCard=selectable&&s.status!=='blocked',recommended=isTotalBlock()&&recommendedBlockedStory()?.id===s.id,pct=s.total>0?clamp((s.total-s.remaining)/s.total*100,0,100):0;const actions=s.status==='blocked'?`<div class="card-actions"><button class="use-solution work-blocked" ${selectable?'':'disabled'} onclick="game.selectStory(${s.id})">🎲 ${uiLang==='en'?'Work':'Trabajar'}</button><button class="use-solution ${recommended?'recommended-action':''}" ${state.solutions.length?'':'disabled'} onclick="game.chooseSolution(${s.id})">${recommended?'★ ':''}${T('useSolution')} (${state.solutions.length})</button></div>`:'';return `<article ${wholeCard?'role="button" tabindex="0"':''} class="story-card ${selectable?'selectable':''} ${state.selectedStoryId===s.id?'selected':''} ${s.status==='blocked'?'blocked':''} ${s.status==='done'?'done':''} ${recommended?'recommended':''}" ${wholeCard?`onclick="game.selectStory(${s.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();game.selectStory(${s.id})}"`:''} aria-label="${esc(L(s.title))}: ${s.remaining} ${uiLang==='en'?'of':'de'} ${s.total} h" aria-describedby="storyDesc${s.id}" title="${esc(L(s.description))}"><span id="storyDesc${s.id}" class="sr-only">${esc(L(s.description))}</span><div class="story-top"><span class="priority">${T('priority')} #${s.priority}</span><span class="hours">${s.remaining} / ${s.total} h</span></div><h4>${esc(L(s.title))}</h4><div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.total-s.remaining}" aria-label="${uiLang==='en'?'Work completed':'Trabajo completado'}"><i style="width:${pct}%"></i></div>${s.problems.length?`<span class="problem-tag">⛔ ${s.problems.length>1?`${s.problems.length} ${uiLang==='en'?'active impediments':'impedimentos activos'}`:esc(L(s.problems[0].title))}</span><span class="recommended-tag">🎲 ${uiLang==='en'?'You can keep reducing hours':'Puedes seguir reduciendo horas'}</span>`:''}${recommended?`<span class="recommended-tag">★ ${uiLang==='en'?'RECOMMENDED TO RECOVER FLOW':'RECOMENDADA PARA RECUPERAR EL FLUJO'}</span>`:''}${actions}</article>`}
    function coachHtml(){const guideTurns=state.difficulty==='guided'?state.players.length*3:state.difficulty==='challenge'?3:5;if(!state.coachEnabled||state.phase!=='play'||(state.turnCount>=guideTurns&&!isTotalBlock()&&!isSprintCommitmentComplete()))return'';const en=uiLang==='en';let title,msg,progress=20;if(isSprintCommitmentComplete()){title=en?'Sprint commitment complete':'Compromiso del sprint terminado';msg=en?'Close the sprint early and continue to the review.':'Cierren el sprint anticipadamente y continúen con la revisión.';progress=100}else if(state.turnActionDone){title=en?'Step 5 · Pass the turn':'Paso 5 · Pasa el turno';msg=en?'Review the calculation and burndown, then pass control to the next participant.':'Revisen el cálculo y los burndown, después pasen el control a la siguiente persona.';progress=100}else if(cardSequenceActive){title=en?'Step 4 · Apply the card':'Paso 4 · Aplica la carta';msg=en?'Read the situation and observe its effect. Solution cards are stored for the whole team.':'Lean la situación y observen su efecto. Las cartas de Solución se guardan para todo el equipo.';progress=80}else if(state.cardReady){title=en?'Step 3 · Draw a card':'Paso 3 · Saca una carta';msg=en?'Click Draw card. The selection is manual so the active participant controls the moment.':'Haz clic en Sacar carta. La selección es manual para que la persona activa controle el momento.';progress=60}else if(state.selectedStoryId){const s=storyById(state.selectedStoryId);title=en?'Step 2 · Roll the dice':'Paso 2 · Lanza los dados';msg=s?.status==='blocked'?(en?'Blocked work may still receive hours; it simply cannot finish until unblocked.':'El trabajo bloqueado sí puede recibir horas; simplemente no terminará hasta desbloquearse.'):(en?'The two dice represent productive hours for this turn.':'Los dos dados representan las horas productivas de este turno.');progress=40}else{title=en?'Step 1 · Choose a story':'Paso 1 · Elige una historia';msg=en?'Choose To do, In progress, or Blocked. The active participant controls the turn.':'Elige Por hacer, En progreso o Bloqueada. La persona activa controla el turno.'}return `<aside class="coach" aria-label="${T('coach')}"><button onclick="game.toggleCoach()" aria-label="${en?'Hide guide':'Ocultar guía'}">×</button><b>${title}</b><p>${msg}</p><div class="coach-progress"><i style="width:${progress}%"></i></div></aside>`}
    function toggleCoach(){state.coachEnabled=!state.coachEnabled;save();render()}
    function selectStory(id){if(state.phase!=='play'||state.turnActionDone||state.lastHours!=null||cardSequenceActive)return;const s=storyById(id);if(!s||!['todo','progress','blocked'].includes(s.status))return;state.selectedStoryId=id;save();render()}
    function roll(){
      const s=storyById(state.selectedStoryId),p=state.players[state.playerIndex];if(!s||state.phase!=='play'||state.turnActionDone||state.lastHours!=null||cardSequenceActive)return;
      if(s.status==='todo'&&wipBlocksNew())return toast(uiLang==='en'?'Reduce work in progress first':'Primero reduzcan el trabajo en proceso');
      state.turnRolling=true;state.lastHours=null;const d1=1+Math.floor(rand()*6),d2=1+Math.floor(rand()*6);state.lastDice=[d1,d2];if(s.status==='todo')s.status='progress';
      const penalty=Number(p.penalty)||0;p.penalty=0;const hours=Math.max(1,d1+d2-penalty);state.lastHours=hours;const applied=Math.min(hours,s.remaining);s.remaining=Math.max(0,s.remaining-hours);creditWork(applied,hours-applied);state.cardReady=false;log(uiLang==='en'?`${p.name} rolled ${d1}+${d2}${penalty?'−'+penalty:''} and applied ${applied} h to “${L(s.title)}”${hours>applied?` (${hours-applied} h unused)`:''}.`:`${p.name} obtuvo ${d1}+${d2}${penalty?'−'+penalty:''} y aplicó ${applied} h a “${L(s.title)}”${hours>applied?` (${hours-applied} h sobrantes)`:''}.`);playDiceSound();save();render();

      // El temporizador puede dispararse cuando el turno ya avanzó (solución/escalamiento + fin de turno).

      const seq=state.turnSeq=(state.turnSeq||0);
      animateDiceFaces(d1,d2);setTimeout(()=>{if(!state||state.phase!=='play'||(state.turnSeq||0)!==seq||state.turnActionDone||!storyById(state.selectedStoryId))return;state.turnRolling=false;state.cardReady=true;save();render();announce(uiLang==='en'?'Dice resolved. Click Draw card.':'Dados resueltos. Haz clic en Sacar carta.')},settleDelay)
    }
    function animateDiceFaces(final1,final2){const a=document.getElementById('die1'),b=document.getElementById('die2'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      const settle=()=>{if(a){a.innerHTML=dieFace(final1,'white');a.classList.remove('rolling');a.classList.add('settled')}if(b){b.innerHTML=dieFace(final2,'red');b.classList.remove('rolling');b.classList.add('settled')}
        setTimeout(()=>{a?.classList.remove('settled');b?.classList.remove('settled')},420)};
      if(reduced||(!a&&!b))return settle();
      a?.classList.add('rolling');b?.classList.add('rolling');
      // Intervalos crecientes (85→190 ms): la cara cambia cada vez más lento, como un dado que pierde inercia.
      const steps=[68,70,75,82,90,100,112,126,142,160];let frame=0;
      const tick=()=>{if(frame<steps.length){if(a)a.innerHTML=dieFace(1+Math.floor(Math.random()*6),'white');if(b)b.innerHTML=dieFace(1+Math.floor(Math.random()*6),'red');setTimeout(tick,steps[frame++])}else{settle();playLandSound()}};
      tick()}
    function nextCard(){if(!state.deck.length){state.deck=shuffle(state.discard.splice(0));if(state.deck.length)log(uiLang==='en'?'The available discard pile was reshuffled. Active cards stay out of the deck.':'Se barajó el descarte disponible. Las cartas activas permanecen fuera del mazo.')}return state.deck.pop()}
    // La carta se persiste ANTES de aplicarse (pendingCard + cardApplied). Si la página se recarga entre

    function drawCard(force=false){if((!state.cardReady&&!force)||cardSequenceActive||state.turnActionDone)return;
      if(state.phase!=='play'||!storyById(state.selectedStoryId)){state.cardReady=false;state.turnRolling=false;cardSequenceActive=false;state.cardSequenceActive=false;save();render();return}

    function showDrawAnimation(){const en=uiLang==='en';showModal(`<div class="modal-head"><div><h2>${en?'Drawing a situation card':'Sorteando una carta de situación'}</h2><p>${en?'Every draw can change the sprint.':'Cada sorteo puede cambiar el sprint.'}</p></div></div><div class="modal-body"><div class="draw-stage"><div class="draw-deck"><div class="draw-card-back"></div></div><i class="draw-spark"></i><i class="draw-spark"></i><i class="draw-spark"></i></div><div class="draw-caption">${en?'Shuffling and revealing…':'Barajando y revelando…'}</div></div>`,false)}
    // Contabilidad real del sprint: horas de trabajo efectivamente aplicadas, horas desperdiciadas por
    // sobrante, alcance añadido y progreso perdido. Antes el "avance neto" se calculaba como
    // max(0, inicio − pendiente), lo que borraba en silencio el trabajo hecho cuando entraba scope u outage.
    function currentStat(){return state.stats[state.sprint-1]||null}
    function creditWork(applied,wasted=0){const st=currentStat();if(!st)return;st.workApplied=(Number(st.workApplied)||0)+Math.max(0,applied);if(wasted>0)st.hoursWasted=(Number(st.hoursWasted)||0)+wasted}
    function creditScope(hours){const st=currentStat();if(st)st.scopeAdded=(Number(st.scopeAdded)||0)+Math.max(0,hours)}
    function creditLoss(hours){const st=currentStat();if(st)st.progressLost=(Number(st.progressLost)||0)+Math.max(0,hours)}
    function applyWork(s,h,label){const applied=Math.min(h,s.remaining);s.remaining=Math.max(0,s.remaining-h);creditWork(applied,h-applied);log(uiLang==='en'?`${label}: ${applied} extra hours on “${L(s.title)}”.`:`${label}: ${applied} h adicionales en “${L(s.title)}”.`)}
    function applyCard(card){
      const s=storyById(state.selectedStoryId),p=state.players[state.playerIndex];
      if(!card||!card.type)return;
      // Si la carta no puede aplicarse (sin historia activa), vuelve al descarte: nunca se destruye.
      if(!s&&card.type!=='solution'&&!['sponsor','audit','overtime','meeting'].includes(card.code)){state.discard.push(card);state.cardReturned=true;return}
      if(card.type==='problem'){state.blockersReceived=(state.blockersReceived||0)+1;if(!s.problems.some(pr=>pr.id===card.id))s.problems.push({id:card.id,title:card.title,text:card.text});s.status='blocked';log(uiLang==='en'?`Problem: “${L(card.title)}” blocked the selected story. The team may keep reducing its hours.`:`Problema: “${L(card.title)}” bloqueó la historia seleccionada. El equipo puede seguir reduciendo sus horas.`,'problem');return}
      if(card.type==='solution'){state.solutions.push({id:card.id,title:card.title,text:card.text});log(uiLang==='en'?`The team stored the solution “${L(card.title)}” for any blocked story.`:`El equipo guardó la solución “${L(card.title)}” para usarla en cualquier historia bloqueada.`,'solution');return}
      switch(card.code){
        case 'specialist':{const a=1+Math.floor(rand()*6),b=1+Math.floor(rand()*6);applyWork(s,a+b,uiLang==='en'?'New specialist':'Nuevo especialista');break}
        case 'sponsor':{const b=state.stories.filter(x=>x.problems.length).sort((a,z)=>a.priority-z.priority)[0];if(b){state.discard.push(...b.problems.map(problemToCard));b.problems=[];b.status=b.remaining<=0?'done':'progress';if(b.status==='done')b.completedSprint=state.sprint;log(uiLang==='en'?`The sponsor unblocked the highest-priority blocked story: “${L(b.title)}”.`:`El sponsor desbloqueó la historia bloqueada de mayor prioridad: “${L(b.title)}”.`)}else log(uiLang==='en'?'There were no active blockers; sponsor support was not needed.':'No había bloqueos activos; el apoyo del sponsor no fue necesario.');break}
        case 'productive':applyWork(s,state.variantRules.productiveHours,uiLang==='en'?'Highly productive day':'Día altamente productivo');break;
        case 'audit':state.players.forEach(x=>x.penalty=Math.max(x.penalty||0,state.variantRules.auditPenalty));log(uiLang==='en'?`Audit: each participant gets −${state.variantRules.auditPenalty} h on their next roll.`:`Auditoría: cada participante tendrá −${state.variantRules.auditPenalty} h en su siguiente tiro.`);break;
        case 'overtime':extraDraws++;state.extraDraws=extraDraws;log(uiLang==='en'?'Overtime: an additional card will be drawn.':'Horas extra: se tomará una tarjeta adicional.');break;
        case 'clean':{const cleared=s.remaining;s.remaining=0;creditWork(cleared);log(uiLang==='en'?`Clean data: “${L(s.title)}” reached 0 h.`:`Datos limpios: “${L(s.title)}” llegó a 0 h.`);break}
        case 'scope':s.total+=state.variantRules.scopeHours;s.remaining+=state.variantRules.scopeHours;creditScope(state.variantRules.scopeHours);log(uiLang==='en'?`Scope change: “${L(s.title)}” increased by ${state.variantRules.scopeHours} h.`:`Cambio de alcance: “${L(s.title)}” aumentó ${state.variantRules.scopeHours} h.`);break;

        case 'meeting':p.skip=1;log(uiLang==='en'?`${p.name} will lose the next turn because of an unexpected meeting.`:`${p.name} perderá su siguiente turno por una reunión inesperada.`);break;

    function overlayFocusables(){return [...overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.hidden)}

    function help(tab='quick'){
      const en=uiLang==='en',tabs=[['quick',en?'Quick start':'Inicio rápido'],['rules',en?'Rules':'Reglas'],['bloom','Bloom'],['glossary',en?'Glossary':'Glosario'],['about',en?'Author & notice':'Autor y aviso']];showModal(`<div class="modal-head"><div><h2>${en?'Help center':'Centro de ayuda'}</h2><p>${en?'Everything needed to facilitate the simulation.':'Todo lo necesario para facilitar la simulación.'}</p></div><button class="close" onclick="game.hideModal()" aria-label="${en?'Close':'Cerrar'}">×</button></div><div class="modal-body"><div class="help-tabs">${tabs.map(t=>`<button class="help-tab ${tab===t[0]?'active':''}" onclick="game.help('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="help-content">${helpContent(tab)}</div></div>`,true)}
    function helpContent(tab){
      if(uiLang==='en'){
        if(tab==='bloom')return `<h3>Why there are three questions</h3><p>At the end of every played sprint, three open questions connect the game result to Scrum and Kanban learning. Each question is led by one participant, but the team builds the response together.</p><h3>Progressive Bloom difficulty</h3><ol><li><b>Sprint 1:</b> Remember → Understand.</li><li><b>Sprint 2:</b> Understand → Apply.</li><li><b>Sprint 3:</b> Apply → Analyze.</li><li><b>Sprint 4:</b> Analyze → Evaluate.</li><li><b>Sprint 5:</b> Evaluate → Create.</li></ol><p>The game draws from a bank of 36 bilingual questions, avoids repeats within a game, and generates a new combination in each new game. Answers appear in the final report.</p>`;
        if(tab==='quick')return `<h3>Objective</h3><p>Experience backlog, capacity, flow, blockers, planned versus actual, and retrospectives across five sprints.</p><h3>Before each sprint</h3><p>Define a sprint goal, choose how many new stories to include, review the suggested capacity, and confirm the commitment. Unfinished work carries over.</p><h3>How a turn works</h3><ol><li>The highlighted participant selects a To do, In progress, or Blocked story.</li><li>They roll two dice; the result subtracts productive hours.</li><li>They click <b>Draw card</b> to manually reveal a random situation.</li><li>They read and apply the effect; Solution cards remain available to the whole team.</li><li>They review both burndowns and pass the turn.</li></ol><h3>Blocked stories</h3><p>You may keep rolling dice on them to reduce hours. They remain Blocked—even at 0 hours—until all active impediments are resolved.</p><h3>Final report</h3><p>After Sprint 5, the report separates the overall game burndown from the burndown for each sprint.</p>`;
        if(tab==='rules')return `<h3>Essential rules</h3><ul><li>Every new game generates a fresh scenario: story hours, event values, deck, dice, and sprint starters vary.</li><li>A story is Done only at 0 hours with no active impediments.</li><li>A blocked story may still receive dice hours. It remains Blocked until every impediment is resolved.</li><li>After the dice, the active participant must click Draw card; cards are not selected automatically.</li><li>A Problem adds an impediment. A Solution is stored for the whole team and can be used on any blocked story.</li><li>WIP includes In progress and Blocked stories. The WIP limit is never exceeded.</li><li>When all active work is blocked, first use a compatible stored Solution. Otherwise continue working and drawing cards, or use Emergency escalation.</li><li>Emergency escalation consumes the active turn, removes one impediment, rolls no dice, draws no card, and does not reduce the burndown.</li><li>If all committed work finishes early, close the sprint and continue to the review.</li><li>Cards are drawn without replacement; active Problems and stored Solutions stay outside the discard pile.</li><li>Sponsor support resolves the highest-priority blocked story. Audit penalties do not stack.</li><li>Unfinished work carries over to the next sprint.</li><li>Net progress counts the hours actually applied to stories; scope added and progress lost are reported separately.</li><li>Roll hours left over when a story reaches 0 do not carry to another story.</li><li>If the backlog finishes before Sprint 5, a final consolidation review opens at the Evaluate and Create Bloom levels.</li><li>Net progress counts the hours actually applied; scope added and progress lost are reported separately.</li><li>If the backlog finishes before Sprint 5, a final consolidation review opens at the Evaluate and Create Bloom levels.</li></ul><h3>Cards</h3><table><tr><th>Type</th><th>Effect</th></tr><tr><td>Event ⚡</td><td>Applies immediately; some values vary by game.</td></tr><tr><td>Problem ⛔</td><td>Adds an impediment; work may continue but cannot finish.</td></tr><tr><td>Solution 🛠</td><td>Is stored for the team and selected when resolving a blocker.</td></tr></table><h3>Reading the burndowns</h3><p>The sprint chart tracks only committed hours for the current sprint. The overall chart tracks all remaining backlog hours across the five-sprint game.</p>`;
        if(tab==='glossary')return `<table><tr><th>Term</th><th>Definition</th></tr><tr><td>Backlog</td><td>Prioritized list of potential work.</td></tr><tr><td>Sprint</td><td>Short period in which the team pursues a goal.</td></tr><tr><td>Story</td><td>A need expressed from a user or stakeholder perspective.</td></tr><tr><td>Capacity</td><td>Work the team estimates it can handle.</td></tr><tr><td>WIP</td><td>Work in Progress: started work that is not yet done.</td></tr><tr><td>Kanban</td><td>Visual method for managing work flow.</td></tr><tr><td>Impediment</td><td>A situation that blocks or hinders progress.</td></tr><tr><td>Definition of Done</td><td>Criteria that determine when work is truly complete.</td></tr><tr><td>Burndown</td><td>Chart of remaining work over time.</td></tr><tr><td>Retrospective</td><td>Team reflection to improve how it works.</td></tr><tr><td>PO</td><td>Product Owner: accountable for maximizing product value.</td></tr><tr><td>OTIF</td><td>On Time In Full: complete and on-time delivery.</td></tr><tr><td>Gemba</td><td>The place where work happens and the process can be observed directly.</td></tr></table>`;
        return `<h3>Authorship</h3><p><b>Game designed and developed by Jesús Vázquez Hernández, PhD., 2026.</b><br><a href="https://www.linkedin.com/in/jvazquezh/" target="_blank" rel="noopener noreferrer">linkedin.com/in/jvazquezh/</a></p><p>Digital adaptation based on <i>Scrum Card Game</i> by Timofey Yevgrashyn under Creative Commons Attribution-ShareAlike 4.0 International.</p><div class="disclaimer"><b>Educational and data-use notice.</b> This simulation simplifies Scrum, Kanban, capacity, and variability. It is not professional advice or a performance assessment, and random results must not be used to evaluate people. A temporary game works normally and is simply not kept after the page closes; only the language and sound preference are remembered. Reports are created only when the team chooses to download them.</div>`
      }
      if(tab==='bloom')return `<h3>Por qué hay tres preguntas</h3><p>Al terminar cada sprint jugado, tres preguntas abiertas conectan el resultado con el aprendizaje de Scrum y Kanban. Cada pregunta tiene una persona guía, pero la respuesta la construye todo el equipo.</p><h3>Dificultad progresiva según Bloom</h3><ol><li><b>Sprint 1:</b> Recordar → Comprender.</li><li><b>Sprint 2:</b> Comprender → Aplicar.</li><li><b>Sprint 3:</b> Aplicar → Analizar.</li><li><b>Sprint 4:</b> Analizar → Evaluar.</li><li><b>Sprint 5:</b> Evaluar → Crear.</li></ol><p>El juego selecciona de un banco de 36 preguntas bilingües, evita repeticiones dentro de la partida y genera una combinación nueva en cada partida. Las respuestas aparecen en el reporte final.</p>`;
      if(tab==='quick')return `<h3>Objetivo</h3><p>Experimentar backlog, capacidad, flujo, bloqueos, planeado vs. real y retrospectiva en cinco sprints.</p><h3>Antes de cada sprint</h3><p>Definan una meta, decidan cuántas historias nuevas incluir, revisen la capacidad orientativa y confirmen el compromiso. El trabajo no terminado se transfiere.</p><h3>Cómo funciona un turno</h3><ol><li>La persona resaltada selecciona una historia Por hacer, En progreso o Bloqueada.</li><li>Lanza dos dados; el resultado descuenta horas productivas.</li><li>Hace clic en <b>Sacar carta</b> para revelar manualmente una situación aleatoria.</li><li>Lee y aplica el efecto; las cartas de Solución quedan disponibles para todo el equipo.</li><li>Revisa ambos burndown y pasa el turno.</li></ol><h3>Historias bloqueadas</h3><p>Pueden seguir recibiendo tiradas para reducir horas. Permanecen Bloqueadas —incluso al llegar a 0 horas— hasta resolver todos sus impedimentos.</p><h3>Reporte final</h3><p>Al terminar el Sprint 5, el reporte separa el burndown general del juego y el burndown de cada sprint.</p>`;
      if(tab==='rules')return `<h3>Reglas esenciales</h3><ul><li>Cada partida nueva genera un escenario fresco: cambian horas, valores de eventos, mazo, dados e iniciadores de sprint.</li><li>Una historia solo termina con 0 horas y sin impedimentos activos.</li><li>Una historia bloqueada sí puede recibir horas de los dados. Seguirá Bloqueada hasta resolver todos sus impedimentos.</li><li>Después de los dados, la persona activa debe hacer clic en Sacar carta; la selección no es automática.</li><li>Un Problema agrega un impedimento. Una Solución se guarda para todo el equipo y puede usarse en cualquier historia bloqueada.</li><li>El WIP incluye historias En progreso y Bloqueadas. Nunca se excede el límite.</li><li>Cuando todo el trabajo activo está bloqueado, primero usen una Solución compatible. Si no hay, continúen trabajando y sacando cartas o utilicen el Escalamiento de emergencia.</li><li>El Escalamiento de emergencia consume el turno activo, retira un impedimento, no usa dados ni carta y no reduce el burndown.</li><li>Si el compromiso termina anticipadamente, se cierra el sprint y se continúa con la revisión.</li><li>Las cartas se barajan sin reemplazo; Problemas activos y Soluciones guardadas permanecen fuera del descarte.</li><li>El Sponsor resuelve la historia bloqueada de mayor prioridad. Las penalizaciones de Auditoría no se acumulan.</li><li>El trabajo incompleto pasa al siguiente sprint.</li><li>El avance neto cuenta las horas realmente aplicadas a las historias; el alcance añadido y el progreso perdido se reportan por separado.</li><li>Las horas de una tirada que sobran al llegar la historia a 0 no se trasladan a otra historia.</li><li>Si el backlog termina antes del Sprint 5, se abre una revisión final de consolidación con los niveles Bloom Evaluar y Crear.</li></ul><h3>Cartas</h3><table><tr><th>Tipo</th><th>Efecto</th></tr><tr><td>Evento ⚡</td><td>Se aplica inmediatamente; algunos valores cambian por partida.</td></tr><tr><td>Problema ⛔</td><td>Agrega un impedimento; el trabajo puede continuar, pero no terminar.</td></tr><tr><td>Solución 🛠</td><td>Se guarda para el equipo y se selecciona al resolver un bloqueo.</td></tr></table><h3>Interpretación de los burndown</h3><p>El gráfico del sprint sigue solo las horas comprometidas en el sprint actual. El gráfico general sigue todas las horas pendientes del backlog durante los cinco sprints.</p>`;
      if(tab==='glossary')return `<table><tr><th>Término</th><th>Definición</th></tr><tr><td>Backlog</td><td>Lista priorizada del trabajo potencial.</td></tr><tr><td>Sprint</td><td>Periodo breve en el que el equipo busca alcanzar un objetivo.</td></tr><tr><td>Historia</td><td>Necesidad expresada desde la perspectiva de un usuario o interesado.</td></tr><tr><td>Capacidad</td><td>Trabajo que el equipo estima que puede atender.</td></tr><tr><td>WIP</td><td>Work in Progress: trabajo iniciado que todavía no termina.</td></tr><tr><td>Kanban</td><td>Método visual para gestionar el flujo de trabajo.</td></tr><tr><td>Impedimento</td><td>Situación que bloquea o dificulta el avance.</td></tr><tr><td>Definición de terminado</td><td>Criterios que determinan cuándo el trabajo está realmente completo.</td></tr><tr><td>Burndown</td><td>Gráfica del trabajo pendiente a lo largo del tiempo.</td></tr><tr><td>Retrospectiva</td><td>Reflexión del equipo para mejorar su forma de trabajar.</td></tr><tr><td>PO</td><td>Product Owner: responsable de maximizar el valor del producto.</td></tr><tr><td>OTIF</td><td>On Time In Full: entrega completa y a tiempo.</td></tr><tr><td>Gemba</td><td>Lugar donde ocurre el trabajo y se observa directamente el proceso.</td></tr></table>`;
      return `<h3>Autoría</h3><p><b>Videojuego diseñado y desarrollado por Jesús Vázquez Hernández, PhD., 2026.</b><br><a href="https://www.linkedin.com/in/jvazquezh/" target="_blank" rel="noopener noreferrer">linkedin.com/in/jvazquezh/</a></p><p>Adaptación digital basada en <i>Scrum Card Game</i> de Timofey Yevgrashyn, conforme a Creative Commons Attribution-ShareAlike 4.0 International.</p><div class="disclaimer"><b>Aviso educativo y de uso de datos.</b> Esta simulación simplifica Scrum, Kanban, capacidad y variabilidad. No constituye asesoría profesional ni evaluación del desempeño; los resultados aleatorios no deben usarse para evaluar personas. Una partida temporal funciona normalmente y simplemente no se conserva al cerrar la página; solo se recuerdan el idioma y la preferencia de sonido. Los reportes se crean únicamente cuando el equipo decide descargarlos.</div>`
    }

    function renderTutorial(){const en=uiLang==='en',steps=Array.from({length:7},(_,i)=>`<i class="${i<=tutorialStep?'done':''}"></i>`).join('');let scene='',action='';

        function downloadClassic(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)}
        async function download(name,text,type,okMsg){
          let api=null;
          try{if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function')api=await claude.use('downloads')}catch(e){api=null}
          if(!api){downloadClassic(name,text,type);if(okMsg)toast(okMsg);return true}
          const en=uiLang==='en';
          try{await api.save({filename:name,data:text});if(okMsg)toast(okMsg);return true}
          catch(e){const code=e&&e.code;
            if(code==='extension_not_enabled'&&name.slice(-4).toLowerCase()==='.csv'){
              try{await api.save({filename:name.slice(0,-4)+'.txt',data:text});toast(en?'Saved as .txt: rename it to .csv to open it in Excel.':'Guardado como .txt: renómbralo a .csv para abrirlo en Excel.');return true}catch(e2){}
            }
            if(code==='declined')return false;
            if(code==='rate_limited'){toast(en?'A save is already in progress. Try again in a moment.':'Ya hay una descarga en curso. Inténtalo en un momento.');return false}
            toast(en?'The file could not be saved here. Open the local copy of the game to download it.':'No se pudo guardar el archivo aquí. Abre la copia local del juego para descargarlo.');return false}
        }
